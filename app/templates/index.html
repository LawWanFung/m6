<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>六合彩數據儀表板 · Mark Six Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#0f1220; --card:#1a1f36; --accent:#5b8def; --good:#3ec979; --warn:#e6b54a; --bad:#e45b6b; --txt:#e6e8f0; --muted:#8b90a8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); }
    header { padding:24px 28px; background:linear-gradient(90deg,#1a1f36,#232a4d); border-bottom:1px solid #2a3158; }
    header h1 { margin:0; font-size:22px; }
    header p { margin:6px 0 0; color:var(--muted); font-size:13px; }
    main { max-width:1100px; margin:0 auto; padding:24px; }
    .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
    button { background:var(--accent); color:#fff; border:0; padding:9px 16px; border-radius:8px; cursor:pointer; font-size:14px; }
    button:hover { opacity:.9; }
    input[type=number] { padding:8px 10px; border-radius:8px; border:1px solid #2a3158; background:#12162b; color:var(--txt); width:80px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-bottom:20px; }
    .card { background:var(--card); border:1px solid #262c4d; border-radius:12px; padding:18px; }
    .card h3 { margin:0 0 12px; font-size:14px; color:var(--muted); font-weight:600; }
    .stat { font-size:30px; font-weight:700; }
    .muted { color:var(--muted); font-size:12px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    td, th { padding:5px 8px; text-align:left; border-bottom:1px solid #262c4d; }
    .tag { display:inline-block; padding:2px 8px; border-radius:6px; font-size:12px; }
    .g { background:rgba(62,201,121,.15); color:var(--good); }
    .w { background:rgba(230,181,74,.15); color:var(--warn); }
    .chart-wrap { background:var(--card); border:1px solid #262c4d; border-radius:12px; padding:18px; margin-bottom:20px; }
    .full { grid-column:1/-1; }
    #status { color:var(--warn); font-size:13px; }
    .nums { display:flex; flex-wrap:wrap; gap:6px; }
    .chip { width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; background:#2a3158; flex-direction: column; }
    .chip.hot { background:var(--good); color:#06210f; }
    .chip.cold { background:var(--bad); color:#2a0810; }
    .r { text-align:right; }
    #modelTable { width:100%; border-collapse:collapse; font-size:13px; }
    #modelTable th, #modelTable td { padding:8px 10px; text-align:left; border-bottom:1px solid #262c4d; }
    #modelTable th { color:var(--muted); font-weight:600; }
    #modelTable td.r, #modelTable th.r { text-align:right; }
    .mbadge { display:inline-block; padding:1px 7px; border-radius:6px; font-size:11px; }
    .k-sklearn { background:rgba(91,141,239,.15); color:var(--accent); }
    .k-統計 { background:rgba(230,181,74,.15); color:var(--warn); }
    .k-深度學習 { background:rgba(160,120,240,.15); color:#c39fff; }
    .k-baseline { background:rgba(139,144,168,.15); color:var(--muted); }
    .chip-pred { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; background:#2a3158; color:var(--txt); font-size:11px; font-weight:600; margin:0 1px; }
    .chip-pred.hi { background:var(--accent); color:#fff; }
  </style>
</head>
<body>
<header>
  <h1>🎲 六合彩數據儀表板</h1>
  <p>統計分析 · 公平性檢驗 · 冷熱號 · 建模驗證（此工具僅供研究，無法預測開獎）</p>
</header>
<main>
  <div class="toolbar">
    <button id="runBtn">重新分析</button>
    <button id="fetchBtn">🔄 抓取最新 HKJC 數據</button>
    <label class="muted">滯後期數 lookback
      <input id="lookback" type="number" value="10" min="1" max="60">
    </label>
    <span id="status"></span>
  </div>

  <div class="grid" id="stats"></div>

  <div class="chart-wrap">
    <h3>主號 1–49 出現頻率</h3>
    <canvas id="freqChart" height="120"></canvas>
  </div>

  <div class="grid">
    <div class="card">
      <h3>熱號 / 冷號（主號）</h3>
      <div><b class="g">熱號</b><div class="nums" id="hotNums"></div></div>
      <p style="margin:10px 0 6px"><b class="w">冷號</b><div class="nums" id="coldNums"></div></p>
      <div class="muted">率 = 每期出現機率（已考慮 46–49 號歷史上場窗口，避免遲出號碼被誤判為冷）</div>
    </div>
  </div>

  <div class="chart-wrap">
    <h3>🧠 多預測模型比較（log-loss 越低越好，均勻基線 = ln 49 ≈ 3.89）</h3>
    <div class="muted" style="margin-bottom:12px">六合彩係獨立隨機事件，理論上沒有任何模型能長期勝過均勻隨機。下表所有模型都用同一個 metric（log-loss）對比，皆以均勻基線為參考線。</div>
    <div style="background:#12162b;border:1px solid #262c4d;border-radius:10px;padding:14px">
      <canvas id="modelChart" height="280"></canvas>
    </div>
    <table id="modelTable" style="margin-top:16px">
      <thead>
        <tr><th>模型</th><th>類型</th><th>預測號碼</th><th>說明</th><th class="r">log-loss</th><th class="r">對基線</th><th>判定</th></tr>
      </thead>
      <tbody id="modelBody"><tr><td colspan="6" class="muted">載入中…</td></tr></tbody>
    </table>
  </div>
</main>

<script>
let freqChart = null;
let modelChart = null;

function fmt(v){ return (typeof v === 'object' && v !== null)
  ? Object.entries(v).map(([k,val])=>`${k}: ${Math.round(val)}`).join(' · ') : v; }

async function fetchData(lookback){
  const url = lookback && lookback>0
    ? `/api/models?lookback=${lookback}` : `/api/analysis`;
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d = await r.json();
  return { analysis: d.analysis ?? d, models: d.models ?? [] };
}

function render(analysis, models){
  // stats cards
  const stats = document.getElementById('stats');
  const chi = analysis.main_chi2 || {};
  const cc = chi.significant_05 === true || chi.significant_05 === 'True';
  const dr = analysis.date_range || {};
  const srcOk = analysis.data_source === 'real';
  const srcNote = srcOk
    ? `✅ 真實 HKJC 數據${dr.first? `（${dr.first} ~ ${dr.last}）`:''}`
    : `⚠️ 非真實數據（${analysis.data_source||'unknown'}）`;

  // 分時代公平性（考慮 46–49 號歷史上場窗口，三代各測各代 pool）
  const eras = analysis.era_chi2 || [];
  const eraRows = eras.map(e => {
    const mc = e.main_chi2 || {};
    const sig = mc.significant_05 === true || mc.significant_05 === 'True';
    return `<div style="display:flex;justify-content:space-between;gap:8px">
      <span>${e.era} · pool ${e.pool} · ${e.n_draws}期</span>
      <span class="${sig?'w':'g'}">p=${mc.p_value!=null? mc.p_value.toFixed(3):'-'}</span>
    </div>`;
  }).join('') || '<div class="muted">無資料</div>';
  const eraLast = eras[eras.length-1] || {};

  stats.innerHTML = `
    <div class="card"><h3>數據期數</h3><div class="stat">${analysis.n_draws}</div>
      <div class="muted" style="margin-top:6px">${srcNote}</div></div>
    <div class="card"><h3>公平性（分時代 χ²）</h3>
      <div style="display:flex;flex-direction:column;gap:4px">${eraRows}</div>
      <div class="muted" style="margin-top:6px">以最新一代（${eraLast.era||'-'}，pool ${eraLast.pool||'-'}）為主，避免遲出號碼（46–49）產生假性偏差</div></div>
    <div class="card"><h3>特別號公平性 (χ²)</h3>
      <div class="stat">${analysis.extra_chi2.p_value!=null? analysis.extra_chi2.p_value.toFixed(3):'-'}</div>
      <div class="muted">${(analysis.extra_chi2.significant_05==='True')?'⚠️ 有偏差':'✅ 均勻'}</div></div>
    <div class="card"><h3>平均開獎總和</h3>
      <div class="stat">${(analysis.descriptive||{}).sum_mean!=null? Math.round(analysis.descriptive.sum_mean):'-'}</div>
      <div class="muted">標準差 ${(analysis.descriptive||{}).sum_std!=null? Math.round(analysis.descriptive.sum_std):'-'}</div></div>`;

  // frequency chart：改按『率』（每期出現機率，已按歷史上場窗口正規化）
  const rate = analysis.main_rate || {};
  const labels = Array.from({length:49},(_,i)=>i+1);
  const data = labels.map(l => rate[l] ?? 0);
  const meanRate = data.reduce((a,b)=>a+b,0) / 49;
  if(freqChart) freqChart.destroy();
  freqChart = new Chart(document.getElementById('freqChart'), {
    type:'bar',
    data:{ labels, datasets:[{
      label:'每期出現率', data,
      backgroundColor: labels.map(l => (rate[l]??0) >= meanRate ? '#3ec979' : '#e45b6b')
    }]},
    options:{ responsive:true, plugins:{legend:{display:false}, title:{display:true, text:'每期出現率（已按歷史上場窗口正規化）'}},
      scales:{ x:{ticks:{color:'#8b90a8',maxRotation:90,minRotation:45}}, y:{ticks:{color:'#8b90a8', callback: v => (v*100).toFixed(1)+'%'}}, } }
  });

  // cold/hot
  const ch = analysis.cold_hot || {};
  const hot = document.getElementById('hotNums');
  const cold = document.getElementById('coldNums');
  hot.innerHTML = Object.keys(ch.hot||{}).map(k=>`<span class="chip hot">${k}<sub style="opacity:.7">${(ch.hot[k]*100).toFixed(2)}%</sub></span>`).join('') || '<span class="muted">無資料</span>';
  cold.innerHTML = Object.keys(ch.cold||{}).map(k=>`<span class="chip cold">${k}<sub style="opacity:.7">${(ch.cold[k]*100).toFixed(2)}%</sub></span>`).join('') || '<span class="muted">無資料</span>';

  // model comparison table + chart
  renderModelChart(models);
  renderModelTable(models);
}

function fmtLL(v){ return (v!=null && !Number.isNaN(v)) ? v.toFixed(3) : '—'; }

// 將每個模型預測的 6 個號碼渲染成小 chips
function predChips(pn){
  if(!pn || pn.length === 0) return '<span class="muted">—</span>';
  return pn.map((n,i) => `<span class="chip-pred${i===0?' hi':''}" title="預測第${i+1} 號">${n}</span>`).join('');
}

// 一次過 show 晒所有模型的 log-loss 條圖，配基線虛線作對比
function renderModelChart(models){
  const el = document.getElementById('modelChart');
  if(modelChart) modelChart.destroy();
  const base = 3.8918;
  const arr = models || [];
  const labels = arr.map(m => m.name);
  const data = arr.map(m => m.mean_log_loss);
  const colors = arr.map(m => {
    const ll = m.mean_log_loss;
    if(m.kind === 'baseline') return 'rgba(139,144,168,.55)';
    if(ll == null) return 'rgba(230,181,74,.65)';
    return ll < base ? '#3ec979' : '#e45b6b';
  });
  modelChart = new Chart(el, {
    type:'bar',
    data:{ labels, datasets:[
      { label:'log-loss', data, backgroundColor: colors, borderColor: colors, borderWidth:1, barPercentage:0.7 },
      { type:'line', label:'均勻基線', data: labels.map(()=>base),
        borderColor:'#e6b54a', borderDash:[6,4], borderWidth:2, pointRadius:0, fill:false }
    ]},
    options:{
      indexAxis:'y',
      responsive:true,
      plugins:{ legend:{display:true, labels:{color:'#e6e8f0'}},
        title:{display:true, text:'各模型 log-loss 比較（均勻基線 = 3.89）'} },
      scales:{
        x:{ticks:{color:'#8b90a8', callback:v=>v.toFixed(1)}, min:0, startValue:0,
           title:{display:true, text:'log-loss（越低越好）', color:'#8b90a8'}},
        y:{ticks:{color:'#8b90a8', maxRotation:0}, grid:{color:'#262c4d'}}
      }
    }
  });
}

function renderModelTable(models){
  const base = Math.min(...(models||[]).map(m => m.mean_log_loss).filter(x => x!=null));
  const tbody = document.getElementById('modelBody');
  if(!models || models.length === 0){
    tbody.innerHTML = '<tr><td colspan="6" class="muted">無資料</td></tr>';
    return;
  }
  tbody.innerHTML = models.map(m => {
    const ll = m.mean_log_loss;
    const nearBase = (ll != null && Math.abs(ll - 3.8918) < 0.05);
    const overBase = (ll != null && ll >= 3.8918);
    let verdict, vclass;
    if (m.can_predict === true) { verdict = '✅ 優於隨機（異常）'; vclass = 'g'; }
    else if (ll == null) { verdict = '⚠️ 無結果'; vclass = 'w'; }
    else if (nearBase) { verdict = '≈ 與隨機持平'; vclass = 'w'; }
    else { verdict = '❌ 輸給隨機'; vclass = 'g'; }  // 輸給隨機 = 符合預期（正常）
    return `<tr>
      <td><b>${m.name}</b></td>
      <td><span class="mbadge k-${m.kind||'misc'}">${m.kind||'/'}</span></td>
      <td>${predChips(m.predicted_numbers)}</td>
      <td class="muted">${m.description || ''}</td>
      <td class="r"><b>${fmtLL(ll)}</b></td>
      <td class="r">${ll != null ? (3.8918 - ll).toFixed(3) : '—'}</td>
      <td class="${vclass}">${verdict}</td>
    </tr>`;
  }).join('');
}

async function run(){
  const status = document.getElementById('status');
  const lookback = document.getElementById('lookback').value;
  status.textContent = '分析中…';
  try {
    const d = await fetchData(lookback);
    render(d.analysis, d.models);
    status.textContent = `✓ 完成 @ ${new Date().toLocaleTimeString()}`;
  } catch(e){
    status.textContent = '✗ 出錯：'+e.message;
  }
}

// 抓取最新 HKJC 數據（背景執行，輪詢進度）
async function fetchLatest(){
  const status = document.getElementById('status');
  const btn = document.getElementById('fetchBtn');
  btn.disabled = true;
  status.textContent = '抓取中…';
  try {
    const r = await fetch('/api/fetch', {method:'POST'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const { task_id } = await r.json();

    // 輪詢進度
    while(true){
      const s = await (await fetch(`/api/fetch_status?task_id=${task_id}`)).json();
      if(s.status === 'fetching' || s.status === 'starting'){
        status.textContent = `抓取中… ${s.progress || ''}`;
        await new Promise(res => setTimeout(res, s.interval*1000 || 2000));
      } else {
        status.textContent = s.status === 'success'
          ? `✓ 抓取完成 @ ${new Date().toLocaleTimeString()}（${s.summary||''}）`
          : `✗ 抓取失敗：${s.error || ''}`;
        // 成功就刷新儀表板
        if(s.status === 'success') await run();
        break;
      }
    }
  } catch(e){
    status.textContent = '✗ 出錯：'+e.message;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('runBtn').addEventListener('click', run);
document.getElementById('fetchBtn').addEventListener('click', fetchLatest);
document.getElementById('lookback').addEventListener('keydown', e=>{ if(e.key==='Enter') run(); });
run();
</script>
</body>
</html>
